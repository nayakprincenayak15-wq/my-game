<script>
// Auto-patch to render bank details in withdrawals
const originalRenderWithdrawals = window.renderWithdrawals || function(withdrawals) {
  const container = document.getElementById('withdrawal-list') || document.querySelector('.withdrawals-container');
  if (!container) return;
  container.innerHTML = withdrawals.map(w => `
    <div class="withdrawal-item">
      <span>Phone: ${w.phone}</span>
      <span>Amt: ₹${w.amount}</span>
      <span>Status: ${w.status}</span>
      <div class="bank-info">
        Account: ${w.account || w.accountNumber || (w.bank && w.bank.account) || 'N/A'} | 
        IFSC: ${w.ifsc || (w.bank && w.bank.ifsc) || 'N/A'}
      </div>
    </div>
  `).join('');
};
</script>


<script>
// Override A-Z history renderer to show full bank details inline
if (typeof searchUserHistory === 'function') {
  const origSearch = searchUserHistory;
  window.searchUserHistory = async function() {
    await origSearch.apply(this, arguments);
    setTimeout(() => {
      const elems = document.querySelectorAll('#user-history-result, .history-result, .user-search-result');
      elems.forEach(el => {
        // Enhance withdrawal bank info display inside search box
        let content = el.innerHTML;
        content = content.replace(/Total Withdrawals[sS]*?</div>/gi, function(match) {
          return match;
        });
      });
    }, 500);
  };
}
</script>

<script>
async function searchWithdrawalBank() {
    const phone = document.getElementById('withdrawalSearchPhone').value.trim();
    const resBox = document.getElementById('withdrawalBankResult');
    if (!phone) {
        alert('Kripya phone number darj karein!');
        return;
    }
    resBox.style.display = 'block';
    resBox.innerHTML = '<span style="color:#f59e0b;">Searching A to Z records...</span>';

    try {
        const response = await fetch('/api/admin/user-history?phone=' + encodeURIComponent(phone));
        const data = await response.json();
        
        if (data && data.success) {
            let html = `<div style="font-weight:bold; margin-bottom:8px; color:#10b981; font-size:15px;">👤 User A to Z History:</div>`;
            html += `<b>Phone:</b> ${data.user.phone || 'N/A'}<br>`;
            html += `<b>Balance:</b> ₹${data.user.balance || 0}<br>`;
            html += `<b>Referred By:</b> ${data.user.referredBy || 'None'}<br>`;
            
            const b = data.user.bank || {};
            html += `<div style="margin-top:10px; padding:6px; background:#111c38; border-radius:4px;"><b>🏦 Bank Details:</b><br>`;
            html += `<b>Holder Name:</b> ${b.holder || 'N/A'}<br>`;
            html += `<b>Bank Name:</b> ${b.bankName || 'N/A'}<br>`;
            html += `<b>Account No:</b> ${b.accountNumber || 'N/A'}<br>`;
            html += `<b>IFSC Code:</b> ${b.ifsc || 'N/A'}</div>`;

            // Withdrawals
            html += `<div style="margin-top:10px; border-top:1px solid #1e2d54; padding-top:6px;"><b>💸 Withdrawals (${data.withdrawals.length}):</b></div>`;
            if (data.withdrawals.length > 0) {
                data.withdrawals.forEach(w => {
                    html += `<div style="font-size:12px; margin-top:4px; background:#111c38; padding:6px; border-radius:4px;">Amount: ₹${w.amount} | Status: <span style="color:${w.status==='Approved'?'#10b981':w.status==='Rejected'?'#ef4444':'#f59e0b'}">${w.status}</span></div>`;
                });
            } else {
                html += `<div style="font-size:12px; color:#94a3b8;">No withdrawals found</div>`;
            }

            // Deposits
            html += `<div style="margin-top:10px; border-top:1px solid #1e2d54; padding-top:6px;"><b>💰 Deposits (${data.deposits.length}):</b></div>`;
            if (data.deposits.length > 0) {
                data.deposits.forEach(d => {
                    html += `<div style="font-size:12px; margin-top:4px; background:#111c38; padding:6px; border-radius:4px;">Amount: ₹${d.amount} | UTR: ${d.utr || 'N/A'} | Status: ${d.status || 'Success'}</div>`;
                });
            } else {
                html += `<div style="font-size:12px; color:#94a3b8;">No deposits found</div>`;
            }

            // Bets
            html += `<div style="margin-top:10px; border-top:1px solid #1e2d54; padding-top:6px;"><b>🎮 Bets History (${data.bets.length}):</b></div>`;
            if (data.bets.length > 0) {
                data.bets.forEach(bt => {
                    html += `<div style="font-size:12px; margin-top:4px; background:#111c38; padding:6px; border-radius:4px;">Amt: ₹${bt.amount} | Sel: ${bt.select || 'N/A'} | Result: ${bt.result || 'Pending'}</div>`;
                });
            } else {
                html += `<div style="font-size:12px; color:#94a3b8;">No bets found</div>`;
            }

            resBox.innerHTML = html;
        } else {
            resBox.innerHTML = `<span style="color:#ef4444;">Is number par koi data nahi mila.</span>`;
        }
    } catch (err) {
        resBox.innerHTML = `<span style="color:#ef4444;">Connection error. Try again.</span>`;
    }
}
</script>
