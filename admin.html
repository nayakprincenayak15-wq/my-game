<script>
// Direct DOM Interceptor for Search Full A-Z History
(function() {
  const origFetch = window.fetch;
  window.fetch = async function() {
    const response = await origFetch.apply(this, arguments);
    const url = arguments[0] || '';
    if (typeof url === 'string' && (url.includes('/api/admin/user-history') || url.includes('user-history') || url.includes('/api/admin/data'))) {
      const cloned = response.clone();
      cloned.json().then(data => {
        if (data) {
          window.__lastUserHistoryData = data;
        }
      }).catch(() => {});
    }
    return response;
  };

  setInterval(() => {
    const searchResBox = document.getElementById('user-history-result') || document.querySelector('.user-search-result') || document.body;
    if (!searchResBox) return;

    // Search for elements containing bank name and format them
    const pElements = searchResBox.querySelectorAll('div, p, span, li');
    pElements.forEach(el => {
      if (el.children.length === 0 && el.innerText.includes('Punjab National Bank') && !el.innerText.includes('A/C:')) {
        let bankStr = 'Punjab National Bank';
        if (window.__lastUserHistoryData) {
          const wList = window.__lastUserHistoryData.withdrawals || window.__lastUserHistoryData.userWithdrawals || [];
          if (wList.length > 0) {
            const w = wList[0];
            const name = w.holderName || w.name || w.accountHolder || (w.bank && w.bank.name) || '';
            const acc = w.accountNumber || w.account || (w.bank && w.bank.account) || '';
            const ifsc = w.ifsc || (w.bank && w.bank.ifsc) || '';
            
            let extra = [];
            if (name) extra.push('Holder: ' + name);
            if (acc) extra.push('A/C: ' + acc);
            if (ifsc) extra.push('IFSC: ' + ifsc);

            if (extra.length > 0) {
              bankStr += ' | ' + extra.join(' | ');
            }
          }
        }
        el.innerText = el.innerText.replace('Punjab National Bank', bankStr);
      }
    });
  }, 500);
})();
</script>


<script>
(function() {
  // Override search function formatting
  const origSearch = window.searchUserHistory || window.searchUser;
  
  function formatWithdrawalLine(w) {
    if (!w) return '';
    let bankName = w.bankName || w.bank || 'Bank';
    let holder = w.holderName || w.name || w.accountHolder || (w.bank && w.bank.name) || '';
    let acc = w.accountNumber || w.account || (w.bank && w.bank.account) || '';
    let ifsc = w.ifsc || (w.bank && w.bank.ifsc) || '';
    
    let details = [bankName];
    if (holder) details.push('Name: ' + holder);
    if (acc) details.push('A/C: ' + acc);
    if (ifsc) details.push('IFSC: ' + ifsc);
    
    return details.join(' | ');
  }

  // Intercept innerHTML updates on search history box
  setInterval(() => {
    const box = document.getElementById('user-history-result') || document.querySelector('.user-search-result');
    if (!box) return;

    if (window.__lastUserHistoryData && window.__lastUserHistoryData.withdrawals) {
      const wList = window.__lastUserHistoryData.withdrawals;
      let htmlContent = box.innerHTML;
      
      wList.forEach(w => {
        const fullBankText = formatWithdrawalLine(w);
        if (fullBankText && htmlContent.includes('Punjab National Bank') && !htmlContent.includes('A/C:')) {
          box.innerHTML = box.innerHTML.replace(/Punjab National Bank/g, fullBankText);
        }
      });
    }
  }, 400);
})();
</script>

<script>
async function searchWithdrawalBank() {
    const phone = document.getElementById('withdrawalSearchPhone').value.trim();
    const resBox = document.getElementById('withdrawalBankResult');
    if (!phone) {
        alert('Kripya phone number darj karein!');
        return;
    }
    resBox.style.display = 'block';
    resBox.innerHTML = '<span style="color:#f59e0b;">Searching A to Z records...</span>';

    try {
        const response = await fetch('/api/admin/user-history?phone=' + encodeURIComponent(phone));
        const data = await response.json();
        
        if (data && data.success) {
            let html = `<div style="font-weight:bold; margin-bottom:8px; color:#10b981; font-size:15px;">👤 User A to Z History:</div>`;
            html += `<b>Phone:</b> ${data.user.phone || 'N/A'}<br>`;
            html += `<b>Balance:</b> ₹${data.user.balance || 0}<br>`;
            html += `<b>Referred By:</b> ${data.user.referredBy || 'None'}<br>`;
            
            const b = data.user.bank || {};
            html += `<div style="margin-top:10px; padding:6px; background:#111c38; border-radius:4px;"><b>🏦 Bank Details:</b><br>`;
            html += `<b>Holder Name:</b> ${b.holder || 'N/A'}<br>`;
            html += `<b>Bank Name:</b> ${b.bankName || 'N/A'}<br>`;
            html += `<b>Account No:</b> ${b.accountNumber || 'N/A'}<br>`;
            html += `<b>IFSC Code:</b> ${b.ifsc || 'N/A'}</div>`;

            // Withdrawals
            html += `<div style="margin-top:10px; border-top:1px solid #1e2d54; padding-top:6px;"><b>💸 Withdrawals (${data.withdrawals.length}):</b></div>`;
            if (data.withdrawals.length > 0) {
                data.withdrawals.forEach(w => {
                    html += `<div style="font-size:12px; margin-top:4px; background:#111c38; padding:6px; border-radius:4px;">Amount: ₹${w.amount} | Status: <span style="color:${w.status==='Approved'?'#10b981':w.status==='Rejected'?'#ef4444':'#f59e0b'}">${w.status}</span></div>`;
                });
            } else {
                html += `<div style="font-size:12px; color:#94a3b8;">No withdrawals found</div>`;
            }

            // Deposits
            html += `<div style="margin-top:10px; border-top:1px solid #1e2d54; padding-top:6px;"><b>💰 Deposits (${data.deposits.length}):</b></div>`;
            if (data.deposits.length > 0) {
                data.deposits.forEach(d => {
                    html += `<div style="font-size:12px; margin-top:4px; background:#111c38; padding:6px; border-radius:4px;">Amount: ₹${d.amount} | UTR: ${d.utr || 'N/A'} | Status: ${d.status || 'Success'}</div>`;
                });
            } else {
                html += `<div style="font-size:12px; color:#94a3b8;">No deposits found</div>`;
            }

            // Bets
            html += `<div style="margin-top:10px; border-top:1px solid #1e2d54; padding-top:6px;"><b>🎮 Bets History (${data.bets.length}):</b></div>`;
            if (data.bets.length > 0) {
                data.bets.forEach(bt => {
                    html += `<div style="font-size:12px; margin-top:4px; background:#111c38; padding:6px; border-radius:4px;">Amt: ₹${bt.amount} | Sel: ${bt.select || 'N/A'} | Result: ${bt.result || 'Pending'}</div>`;
                });
            } else {
                html += `<div style="font-size:12px; color:#94a3b8;">No bets found</div>`;
            }

            resBox.innerHTML = html;
        } else {
            resBox.innerHTML = `<span style="color:#ef4444;">Is number par koi data nahi mila.</span>`;
        }
    } catch (err) {
        resBox.innerHTML = `<span style="color:#ef4444;">Connection error. Try again.</span>`;
    }
}
</script>
