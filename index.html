<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>maan.win</title><script src="/socket.io/socket.io.js"></script><style>*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif;}body{background:#070d19;color:#fff;display:flex;justify-content:center;}.app{width:100%;max-width:420px;background:#0b121e;padding:12px;min-height:100vh;}.hdr{display:flex;justify-content:space-between;align-items:center;}.logo{font-size:18px;font-weight:bold;color:#ff9800;}.card{background:#16243d;border-radius:10px;padding:10px;margin-top:8px;}.btn{padding:8px;border:none;border-radius:6px;font-weight:bold;color:#fff;cursor:pointer;font-size:12px;}.btn-dep{background:#4caf50;flex:1;}.btn-wd{background:#f44336;flex:1;}.tmr{background:#1a2a47;border-radius:10px;padding:10px;margin-top:8px;text-align:center;}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px;}.num{padding:8px;text-align:center;border-radius:50%;font-weight:bold;cursor:pointer;color:#fff;font-size:12px;}.colors{display:flex;gap:6px;margin-top:8px;}.btn-c{flex:1;padding:8px;border-radius:6px;border:none;color:#fff;font-weight:bold;cursor:pointer;font-size:12px;}.bs{display:flex;gap:6px;margin-top:8px;}.btn-b{background:#ff9800;flex:1;}.btn-s{background:#2196f3;flex:1;}.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:#070d19;display:flex;justify-content:center;align-items:center;z-index:100;}.box{width:90%;max-width:360px;background:#0f192c;padding:22px;border-radius:12px;border:1px solid #1a2a47;position:relative;}.inp{width:100%;padding:12px;margin:8px 0;background:#16243d;border:1px solid #2a3c5e;border-radius:8px;color:#fff;font-size:13px;box-sizing:border-box;}.btn-o{width:100%;padding:12px;background:linear-gradient(90deg,#ffa000,#ff8f00);border:none;border-radius:22px;color:#fff;font-weight:bold;margin-top:10px;cursor:pointer;font-size:14px;}.row-inp{display:flex;gap:6px;align-items:center;background:#16243d;border:1px solid #2a3c5e;border-radius:8px;padding:2px 10px;margin:8px 0;}.bet-modal{position:fixed;bottom:0;left:0;width:100%;background:#16243d;border-top-left-radius:16px;border-top-right-radius:16px;padding:16px;z-index:200;display:none;box-shadow:0 -5px 20px rgba(0,0,0,0.6);}.history-box{margin-top:10px;max-height:120px;overflow-y:auto;font-size:10px;background:#16243d;padding:6px;border-radius:6px;display:none;}</style></head><body>
<div id="auth" class="modal"><div class="box" id="lBox" style="background:transparent;border:none;padding:10px;"><div style="text-align:center;margin-bottom:20px;"><div style="background:#16243d;width:70px;height:70px;margin:0 auto 10px auto;border-radius:14px;display:flex;align-items:center;justify-content:center;"><span style="color:#ff9800;font-size:24px;font-weight:bold;">mw</span></div><h2 style="color:#ff9800;">maan.win</h2></div><div class="row-inp"><span style="color:#ffb74d;font-size:13px;font-weight:bold;">+91</span><input type="text" id="lPh" style="background:transparent;border:none;color:#fff;outline:none;width:100%;padding:8px;" maxlength="10" placeholder="Enter your phone number"></div><div class="row-inp"><input type="password" id="lPw" style="background:transparent;border:none;color:#fff;outline:none;width:100%;padding:8px;" placeholder="Please enter the password"></div><button class="btn-o" onclick="login()">Login</button><button class="btn-o" style="background:transparent;border:1px solid #ff9800;color:#ff9800;margin-top:8px;" onclick="showReg()">Register Now</button></div><div class="box" id="rBox" style="display:none;background:transparent;border:none;padding:10px;"><div style="text-align:center;margin-bottom:20px;"><h2 style="color:#ff9800;">maan.win Register</h2></div><div class="row-inp"><span style="color:#ffb74d;font-size:13px;font-weight:bold;">+91</span><input type="text" id="rPh" style="background:transparent;border:none;color:#fff;outline:none;width:100%;padding:8px;" maxlength="10" placeholder="Enter your phone number"></div><div class="row-inp"><input type="password" id="rPw" style="background:transparent;border:none;color:#fff;outline:none;width:100%;padding:8px;" placeholder="Password: 8-15 letters and numbers"></div><div class="row-inp"><input type="password" id="rCp" style="background:transparent;border:none;color:#fff;outline:none;width:100%;padding:8px;" placeholder="Enter the password again"></div><button class="btn-o" onclick="reg()">Register</button><button class="btn-o" style="background:transparent;border:1px solid #ff9800;color:#ff9800;margin-top:8px;" onclick="showLog()">Password Login</button></div></div>

<div id="depModal" class="modal" style="display:none;background:rgba(7,13,25,0.9);"><div class="box" style="text-align:center;"><div style="position:absolute;top:12px;right:16px;cursor:pointer;color:#ff9800;font-size:14px;font-weight:bold;" onclick="toggleHist('depHist')">📋 History</div><h3 style="color:#ff9800;margin-bottom:8px;">Deposit Funds</h3><p style="font-size:11px;color:#8a9bbd;margin-bottom:8px;">Scan QR & Enter 12-digit UTR</p><img id="qrImg" src="https://via.placeholder.com/150" style="width:140px;height:140px;background:#fff;border-radius:6px;margin-bottom:10px;"><input type="number" id="depAmt" class="inp" placeholder="Enter Amount (₹)"><input type="text" id="depUtr" class="inp" placeholder="Enter 12-digit UTR Number"><button class="btn-o" onclick="submitDep()">Submit Deposit</button><button class="btn-o" style="background:#f44336;margin-top:8px;" onclick="document.getElementById('depModal').style.display='none'">Cancel</button><div id="depHist" class="history-box"></div></div></div>

<div id="wdModal" class="modal" style="display:none;background:rgba(7,13,25,0.9);"><div class="box"><div style="position:absolute;top:12px;right:16px;cursor:pointer;color:#ff9800;font-size:14px;font-weight:bold;" onclick="toggleHist('wdHist')">📋 History</div><h3 style="color:#ff9800;text-align:center;margin-bottom:10px;">Withdraw Funds</h3><input type="number" id="wdAmt" class="inp" placeholder="Enter Withdrawal Amount"><input type="text" id="accName" class="inp" placeholder="Enter Account Holder Name"><input type="text" id="accNo" class="inp" placeholder="Enter Account Number"><input type="text" id="ifsc" class="inp" placeholder="Enter IFSC Code"><input type="text" id="bankName" class="inp" placeholder="Enter Bank Name"><button class="btn-o" onclick="submitWd()">Submit Withdrawal</button><button class="btn-o" style="background:#f44336;margin-top:8px;" onclick="document.getElementById('wdModal').style.display='none'">Cancel</button><div id="wdHist" class="history-box"></div></div></div>
<div class="bet-modal" id="betModal">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"><b id="betTitle" style="color:#ff9800;font-size:14px;">WinGo 30sec</b><span style="cursor:pointer;color:#f44336;font-weight:bold;" onclick="closeBetModal()">✕</span></div>
  <div style="font-size:12px;color:#8a9bbd;margin-bottom:6px;">Amount</div>
  <div style="display:flex;gap:4px;margin-bottom:10px;"><button class="btn" style="background:#ff9800;flex:1;" onclick="setAmt(1)">1</button><button class="btn" style="background:#16243d;border:1px solid #2a3c5e;flex:1;" onclick="setAmt(10)">10</button><button class="btn" style="background:#16243d;border:1px solid #2a3c5e;flex:1;" onclick="setAmt(100)">100</button><button class="btn" style="background:#16243d;border:1px solid #2a3c5e;flex:1;" onclick="setAmt(1000)">1000</button></div>
  <div style="font-size:12px;color:#8a9bbd;margin-bottom:6px;">Quantity</div>
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;"><button class="btn" style="background:#ff9800;" onclick="chgQty(-1)">-</button><input type="text" id="betQty" value="1" style="width:60px;text-align:center;background:#0f192c;border:1px solid #2a3c5e;color:#fff;padding:6px;border-radius:4px;" readonly><button class="btn" style="background:#ff9800;" onclick="chgQty(1)">+</button></div>
  <div style="display:flex;gap:4px;margin-bottom:12px;font-size:10px;"><button class="btn" style="background:#2196f3;flex:1;" onclick="setQty(1)">X1</button><button class="btn" style="background:#16243d;border:1px solid #2a3c5e;flex:1;" onclick="setQty(5)">X5</button><button class="btn" style="background:#16243d;border:1px solid #2a3c5e;flex:1;" onclick="setQty(10)">X10</button><button class="btn" style="background:#16243d;border:1px solid #2a3c5e;flex:1;" onclick="setQty(20)">X20</button><button class="btn" style="background:#16243d;border:1px solid #2a3c5e;flex:1;" onclick="setQty(50)">X50</button><button class="btn" style="background:#16243d;border:1px solid #2a3c5e;flex:1;" onclick="setQty(100)">X100</button></div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:13px;"><b>Total Amount:</b> <span id="totAmt" style="color:#00e676;font-weight:bold;">₹1.00</span></div>
  <div style="display:flex;gap:8px;"><button class="btn" style="background:#f44336;flex:1;" onclick="closeBetModal()">Cancel</button><button class="btn" style="background:#4caf50;flex:1;" onclick="confirmBet()">Total Amount <span id="btnTot">₹1.00</span></button></div>
</div>

<div class="app">
  <div class="hdr"><div class="logo">maan.win</div><div style="display:flex;gap:6px;align-items:center;"><a href="https://t.me/support" target="_blank" style="background:#0088cc;color:#fff;padding:5px 8px;border-radius:4px;font-size:10px;text-decoration:none;font-weight:bold;">Telegram</a><button class="btn" style="background:#f44336;padding:4px 8px;font-size:10px;" onclick="logout()">Logout</button></div></div>
  <div class="tmr">
    <div style="font-size:10px;color:#ffb74d">Period: <span id="prd">--</span></div>
    <div style="font-size:24px;font-weight:bold;color:#00e676" id="tmr">00:30</div>
  </div>
  <div class="colors">
    <button class="btn-c" style="background:#4caf50;" onclick="openBetModal('Green')">Green</button>
    <button class="btn-c" style="background:#9c27b0;" onclick="openBetModal('Violet')">Violet</button>
    <button class="btn-c" style="background:#f44336;" onclick="openBetModal('Red')">Red</button>
  </div>
  <div class="grid">
    <div class="num" style="background:#9c27b0" onclick="openBetModal(0)">0</div>
    <div class="num" style="background:#4caf50" onclick="openBetModal(1)">1</div>
    <div class="num" style="background:#f44336" onclick="openBetModal(2)">2</div>
    <div class="num" style="background:#4caf50" onclick="openBetModal(3)">3</div>
    <div class="num" style="background:#f44336" onclick="openBetModal(4)">4</div>
    <div class="num" style="background:#9c27b0" onclick="openBetModal(5)">5</div>
    <div class="num" style="background:#f44336" onclick="openBetModal(6)">6</div>
    <div class="num" style="background:#4caf50" onclick="openBetModal(7)">7</div>
    <div class="num" style="background:#f44336" onclick="openBetModal(8)">8</div>
    <div class="num" style="background:#4caf50" onclick="openBetModal(9)">9</div>
  </div>
  <div class="bs">
    <button class="btn btn-b" onclick="openBetModal('Big')">Big</button>
    <button class="btn btn-s" onclick="openBetModal('Small')">Small</button>
  </div>
  <div style="margin-top:12px;font-size:12px;color:#ff9800;font-weight:bold;">Game History</div>
  <div id="historyTable"></div>
  <div style="margin-top:12px;font-size:12px;color:#ff9800;font-weight:bold;">My Activity History</div>
  <div id="myHistoryTable"></div>
</div>

<script>
const socket=io();
let u=JSON.parse(localStorage.getItem('user'));
if(u){document.getElementById('auth').style.display='none';upd();}

function showReg(){document.getElementById('lBox').style.display='none';document.getElementById('rBox').style.display='block';}
function showLog(){document.getElementById('rBox').style.display='none';document.getElementById('lBox').style.display='block';}

function reg(){
    let phone=document.getElementById('rPh').value;
    let password=document.getElementById('rPw').value;
    let cpw=document.getElementById('rCp').value;
    if(password!==cpw){alert('Passwords do not match!');return;}
    fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,password})})
    .then(r=>r.json()).then(d=>{
        if(d.success){u=d.user;localStorage.setItem('user',JSON.stringify(u));document.getElementById('auth').style.display='none';upd();}
        else alert(d.message);
    });
}

function login(){
    let phone=document.getElementById('lPh').value;
    let password=document.getElementById('lPw').value;
    fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,password})})
    .then(r=>r.json()).then(d=>{
        if(d.success){u=d.user;localStorage.setItem('user',JSON.stringify(u));document.getElementById('auth').style.display='none';upd();}
        else alert(d.message);
    });
}

function logout(){localStorage.removeItem('user');location.reload();}
function upd(){if(!u)return;document.getElementById('gId').innerText='ID: '+u.gameId;document.getElementById('bal').innerText=u.balance.toFixed(2);loadDat();}

socket.on('timer-update',d=>{document.getElementById('tmr').innerText='00:'+(d.timer<10?'0':'')+d.timer;document.getElementById('prd').innerText=d.period;});
socket.on('game-result',()=>loadDat());

let curSel=null, curAmt=1, curQty=1;
function openBetModal(s){curSel=s;curAmt=1;curQty=1;updateBetTotal();document.getElementById('betTitle').innerText='WinGo 30sec - Select '+s;document.getElementById('betModal').style.display='block';}
function closeBetModal(){document.getElementById('betModal').style.display='none';}
function setAmt(a){curAmt=a;updateBetTotal();}
function setQty(q){curQty=q;updateBetTotal();}
function chgQty(n){curQty=Math.max(1,curQty+n);updateBetTotal();}
function updateBetTotal(){let t=curAmt*curQty;document.getElementById('betQty').value=curQty;document.getElementById('totAmt').innerText='₹'+t.toFixed(2);document.getElementById('btnTot').innerText='₹'+t.toFixed(2);}

function confirmBet(){
    let total=curAmt*curQty;
    fetch('/api/bet',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:u.phone,select:curSel,amount:curAmt,quantity:curQty})})
    .then(r=>r.json()).then(d=>{
        alert(d.message);
        if(d.success){u.balance=d.newBalance;upd();closeBetModal();}
    });
}

function submitDep(){
    let amount=document.getElementById('depAmt').value;
    let utr=document.getElementById('depUtr').value;
    fetch('/api/deposit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:u.phone,amount,utr})})
    .then(r=>r.json()).then(d=>{alert(d.message);if(d.success){document.getElementById('depModal').style.display='none';loadDat();}});
}

function submitWd(){
    let amount=document.getElementById('wdAmt').value;
    let accName=document.getElementById('accName').value;
    let accNo=document.getElementById('accNo').value;
    let ifsc=document.getElementById('ifsc').value;
    let bankName=document.getElementById('bankName').value;
    fetch('/api/withdraw',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:u.phone,amount,accName,accNo,ifsc,bankName})})
    .then(r=>r.json()).then(d=>{alert(d.message);if(d.success){u.balance=d.newBalance;document.getElementById('wdModal').style.display='none';upd();}});
}

function toggleHist(id){
    let el = document.getElementById(id);
    el.style.display = el.style.display === 'block' ? 'none' : 'block';
}

function loadDat(){
    if(!u)return;
    fetch('/api/user-data?phone='+u.phone).then(r=>r.json()).then(d=>{
        if(d.user)u.balance=d.user.balance;
        document.getElementById('bal').innerText=u.balance.toFixed(2);
        if(d.settings && d.settings.qrCode) document.getElementById('qrImg').src=d.settings.qrCode;

        let h='<table style="width:100%;margin-top:6px;font-size:10px;border-collapse:collapse;"><thead><tr style="color:#ff9800"><th style="padding:4px;border-bottom:1px solid #1a2a47">Period</th><th style="padding:4px;border-bottom:1px solid #1a2a47">Num</th><th style="padding:4px;border-bottom:1px solid #1a2a47">Result</th></tr></thead><tbody>';
        d.gameHistory.forEach(x=>{let c=x.color==='green'?'#4caf50':x.color==='red'?'#f44336':'#9c27b0';h+='<tr><td style="padding:4px;text-align:center;border-bottom:1px solid #1a2a47">'+x.period+'</td><td style="padding:4px;text-align:center;border-bottom:1px solid #1a2a47;font-weight:bold;color:'+c+'">'+x.number+'</td><td style="padding:4px;text-align:center;border-bottom:1px solid #1a2a47">'+x.bigSmall+'</td></tr>'});
        h+='</tbody></table>';
        document.getElementById('historyTable').innerHTML=h;

        let mh='<table style="width:100%;margin-top:6px;font-size:10px;border-collapse:collapse;"><thead><tr style="color:#ff9800"><th style="padding:4px;border-bottom:1px solid #1a2a47">Type</th><th style="padding:4px;border-bottom:1px solid #1a2a47">Amt</th><th style="padding:4px;border-bottom:1px solid #1a2a47">Status</th></tr></thead><tbody>';
        d.bets.forEach(x=>{let col=x.status==='Win'?'#00e676':x.status==='Loss'?'#f44336':'#ff9800';mh+='<tr><td style="padding:4px;text-align:center;border-bottom:1px solid #1a2a47">'+x.select+'</td><td style="padding:4px;text-align:center;border-bottom:1px solid #1a2a47">₹'+x.totalAmount+'</td><td style="padding:4px;text-align:center;border-bottom:1px solid #1a2a47;color:'+col+';font-weight:bold;">'+x.status+'</td></tr>'});
        mh+='</tbody></table>';
        document.getElementById('myHistoryTable').innerHTML=mh;

        let dh='<table style="width:100%;border-collapse:collapse;">';
        d.deposits.forEach(x=>{let col=x.status==='Approved'?'#00e676':'#ff9800';dh+='<tr><td style="padding:3px;border-bottom:1px solid #2a3c5e">₹'+x.amount+'</td><td style="padding:3px;border-bottom:1px solid #2a3c5e;color:'+col+';font-weight:bold;text-align:right;">'+x.status+'</td></tr>';});
        dh+='</table>';
        document.getElementById('depHist').innerHTML=dh;

        let wh='<table style="width:100%;border-collapse:collapse;">';
        d.withdrawals.forEach(x=>{let col=x.status==='Approved'?'#00e676':'#f44336';wh+='<tr><td style="padding:3px;border-bottom:1px solid #2a3c5e">₹'+x.amount+'</td><td style="padding:3px;border-bottom:1px solid #2a3c5e;color:'+col+';font-weight:bold;text-align:right;">'+x.status+'</td></tr>';});
        wh+='</table>';
        document.getElementById('wdHist').innerHTML=wh;
    });
}
setInterval(loadDat,4000);
function openTg(){ fetch('/api/user-data?phone='+u.phone).then(r=>r.json()).then(d=>{ window.open(d.settings.telegram || 'https://t.me/support', '_blank'); }); }
if(u)loadDat();
</script></body></html>
