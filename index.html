<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>maan.win</title>
    <style>
        body { background-color: #0b1329; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 12px; }
        .container { max-width: 420px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .logo { font-size: 24px; font-weight: bold; color: #f59e0b; }
        .btn-top-tg { background: #0088cc; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }
        .btn-top-lo { background: #ef4444; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }
        .card { background-color: #131d38; border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #1e2d54; }
        .card-inner { display: flex; justify-content: space-between; align-items: flex-start; position: relative; }
        .bal-title { font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
        .bal-amount { font-size: 28px; font-weight: bold; color: #ffffff; }
        .refer-btn { background: transparent; color: #ffffff; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; font-size: 11px; font-weight: bold; }
        .notice-btn { background: #f59e0b; color: #000000; border: 1px solid #ffffff; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px; box-shadow: 0 0 10px rgba(245, 158, 11, 0.5); }
        .notice-banner { border: 1px solid #f59e0b; border-radius: 6px; padding: 6px; font-size: 12px; color: #22c55e; margin-top: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
        .btn-dep { background-color: #22c55e; color: #ffffff; border: none; padding: 12px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
        .btn-wd { background-color: #ef4444; color: #ffffff; border: none; padding: 12px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
        .timer-box { font-size: 42px; font-weight: bold; color: #22c55e; text-align: center; margin: 5px 0; }
        .grid-num { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 12px 0; }
        .num-btn { height: 42px; border-radius: 21px; border: none; font-weight: bold; color: #ffffff; cursor: pointer; font-size: 16px; display: flex; justify-content: center; align-items: center; }
        .btn-green-bg { background-color: #22c55e; }
        .btn-violet-bg { background-color: #a855f7; }
        .btn-red-bg { background-color: #ef4444; }
        .btn-big { background-color: #f59e0b; color: #000000; border: none; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
        .btn-small { background-color: #3b82f6; color: #ffffff; border: none; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
        .hidden { display: none !important; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: flex-end; z-index: 1000; }
        .modal-content { background: #131d38; padding: 15px; border-top-left-radius: 16px; border-top-right-radius: 16px; width: 100%; max-width: 420px; border: 1px solid #1e2d54; box-sizing: border-box; }
        .chip { padding: 6px 12px; border-radius: 6px; background: #1e293b; color: #fff; border: 1px solid #3b82f6; cursor: pointer; font-weight: bold; text-align: center; }
        .chip.active { background: #22c55e; border-color: #22c55e; }
        .status-pending { color: #ef4444; font-weight: bold; }
        .status-approved { color: #22c55e; font-weight: bold; }
        input.field { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #2a3c68; background-color: #0b1329; color: #fff; box-sizing: border-box; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- AUTH SECTION -->
        <div id="auth-section">
            <div style="text-align:center; font-size:32px; font-weight:bold; color:#f59e0b; margin: 40px 0 20px 0;">maan.win</div>
            <div id="login-form" class="card">
                <h3 id="auth-title" style="color:#f59e0b; margin-top:0;">Login</h3>
                <input type="text" id="phone" class="field" placeholder="Enter your phone number">
                <input type="password" id="password" class="field" placeholder="Password: 8-15 chars">
                <input type="password" id="cpassword" class="field placeholder="Confirm password" class="hidden">
                <button class="btn-big" id="auth-btn" onclick="submitAuth()">Login</button>
                <button style="width:100%; padding:10px; background:transparent; color:#3b82f6; border:none; margin-top:10px; font-weight:bold; cursor:pointer;" onclick="toggleMode()">Register Now</button>
            </div>
        </div>

        <!-- MAIN EXACT MATCH DASHBOARD -->
        <div id="game-section" class="hidden">
            <div class="header">
                <div class="logo">maan.win</div>
                <div style="display:flex; gap:8px;">
                    <button class="btn-top-tg" onclick="window.open('https://t.me/support', '_blank')">Telegram</button>
                    <button class="btn-top-lo" onclick="logout()">Logout</button>
                </div>
            </div>

            <div class="card">
                <div class="card-inner">
                    <div>
                        <div class="bal-title" id="user-id-display">Balance (ID: MW984389)</div>
                        <div class="bal-amount" id="user-bal">₹0.00</div>
                    </div>
                    <div style="display:flex; gap:10px; align-items:center;">
                        <button class="refer-btn" onclick="openModal('refer-modal')">
                            <span style="font-size:18px;">🔗</span>
                            <span>Refer</span>
                        </button>
                        <button class="notice-btn" onclick="openModal('notice-modal')">
                            <span>📢</span>
                            <span>NOTICE</span>
                        </button>
                    </div>
                </div>
                <div class="notice-banner" id="notice-banner">maan.win!</div>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-bottom:15px;">
                <button class="btn-dep" onclick="openModal('deposit-modal')">Deposit</button>
                <button class="btn-wd" onclick="openModal('withdraw-modal')">Withdraw</button>
            </div>

            <div class="card">
                <div style="font-size:13px; color:#94a3b8; text-align:center;">Period: <span id="period-val" style="color:#f59e0b; font-weight:bold;">20261015033733</span></div>
                <div class="timer-box" id="timer-val">00:10</div>
                
                <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:10px;">
                    <button class="num-btn btn-green-bg" style="border-radius:8px;" onclick="openBetModal('Green', 1)">Green</button>
                    <button class="num-btn btn-violet-bg" style="border-radius:8px;" onclick="openBetModal('Violet', 3)">Violet</button>
                    <button class="num-btn btn-red-bg" style="border-radius:8px;" onclick="openBetModal('Red', 1)">Red</button>
                </div>

                <div class="grid-num">
                    <button class="num-btn btn-violet-bg" onclick="openBetModal('0', 11)">0</button>
                    <button class="num-btn btn-green-bg" onclick="openBetModal('1', 20)">1</button>
                    <button class="num-btn btn-red-bg" onclick="openBetModal('2', 30)">2</button>
                    <button class="num-btn btn-green-bg" onclick="openBetModal('3', 4)">3</button>
                    <button class="num-btn btn-red-bg" onclick="openBetModal('4', 5)">4</button>
                    <button class="num-btn btn-violet-bg" onclick="openBetModal('5', 60)">5</button>
                    <button class="num-btn btn-red-bg" onclick="openBetModal('6', 70)">6</button>
                    <button class="num-btn btn-green-bg" onclick="openBetModal('7', 80)">7</button>
                    <button class="num-btn btn-red-bg" onclick="openBetModal('8', 90)">8</button>
                    <button class="num-btn btn-green-bg" onclick="openBetModal('9', 10)">9</button>
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;">
                    <button class="btn-big" onclick="openBetModal('Big', 1)">Big</button>
                    <button class="btn-small" onclick="openBetModal('Small', 1)">Small</button>
                </div>
            </div>

            <div class="card">
                <div style="color:#f59e0b; font-weight:bold; margin-bottom:10px; font-size:16px;">Game History</div>
                <div id="history-list">Loading...</div>
            </div>
        </div>
    </div>
